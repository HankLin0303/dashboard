<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>每日任務儀表板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='80'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E" />
<script>
// Independent fail-safe: Esc closes any open modal-backdrop, even if main script breaks.
window.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-backdrop:not([hidden])').forEach(function(el) { el.hidden = true; });
  }
});
</script>
<script src="https://unpkg.com/tesseract.js@5.0.4/dist/tesseract.min.js"
        onerror="console.warn('Tesseract failed to load from CDN. Tesseract OCR disabled; Claude Vision still works.')"></script>
<style>
/* ================================================================
   Notion-style dashboard
   ================================================================ */

:root {
  --bg: #ffffff;
  --text: #37352f;
  --text-soft: #787774;
  --text-mute: #9b9a97;
  --hover: rgba(55, 53, 47, 0.06);
  --hover-2: rgba(55, 53, 47, 0.09);
  --divider: rgba(55, 53, 47, 0.09);
  --divider-strong: rgba(55, 53, 47, 0.16);

  --pill-todo-bg:  #e3e2e0;
  --pill-todo-fg:  #37352f;
  --pill-doing-bg: #fdecc8;
  --pill-doing-fg: #7c5e10;
  --pill-done-bg:  #dbeddb;
  --pill-done-fg:  #2b593f;

  --pill-high-bg:  #ffe2dd;
  --pill-high-fg:  #a14b3a;
  --pill-med-bg:   #fdecc8;
  --pill-med-fg:   #7c5e10;
  --pill-low-bg:   #d3e5ef;
  --pill-low-fg:   #1f5478;

  --callout-bg: #f7f6f3;
  --accent: #2383e2;
  --danger: #eb5757;

  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", Helvetica,
          "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; }
input, textarea { font-family: inherit; }

.page { max-width: 820px; margin: 0 auto; padding: 0 96px 120px; }
@media (max-width: 900px) { .page { padding: 0 24px 100px; } }

.cover { font-size: 78px; line-height: 1; padding: 60px 0 12px; user-select: none; }

.page-header h1 {
  font-size: 40px; font-weight: 700; letter-spacing: -0.01em;
  margin: 2px 0 6px; outline: none; line-height: 1.2;
}
.page-meta {
  color: var(--text-mute); font-size: 13px;
  display: flex; gap: 8px; align-items: center; margin-bottom: 32px;
}
.dot-sep { opacity: 0.6; }

.callout {
  display: flex; gap: 12px; background: var(--callout-bg);
  border-radius: 6px; padding: 14px 16px; margin-bottom: 32px;
}
.callout-icon { font-size: 20px; line-height: 1.4; flex: 0 0 24px; text-align: center; }
.callout-body { flex: 1; min-width: 0; }
.callout-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.callout-title { font-weight: 600; font-size: 15px; }
.callout-desc { color: var(--text-soft); font-size: 13.5px; margin: 4px 0 12px; }
kbd {
  display: inline-block; padding: 0 5px; font-size: 11px;
  font-family: inherit; background: #fff;
  border: 1px solid var(--divider-strong); border-radius: 3px; vertical-align: 1px;
}

.drop-zone {
  border: 1.5px dashed var(--divider-strong); border-radius: 6px;
  padding: 18px; text-align: center; color: var(--text-mute);
  font-size: 13px; background: rgba(255, 255, 255, 0.6);
  cursor: pointer; transition: 0.12s;
}
.drop-zone:hover { background: #fff; color: var(--text-soft); }
.drop-zone.drag {
  border-color: var(--accent);
  background: rgba(35, 131, 226, 0.06); color: var(--accent);
}

.preview-wrap { margin-top: 10px; }
.preview-wrap img {
  max-width: 100%; max-height: 220px;
  border-radius: 4px; border: 1px solid var(--divider);
}

.ocr-status {
  margin-top: 10px; font-size: 13px; color: var(--text-soft);
  padding: 8px 10px; background: rgba(255, 255, 255, 0.6); border-radius: 4px;
}
.ocr-status.error { color: #b04444; background: #fdecea; }

.ocr-result { margin-top: 14px; }
.ocr-result-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.ocr-result-title {
  font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--text-mute);
}
.ocr-result-actions { display: flex; gap: 4px; }
.suggestion-list { display: flex; flex-direction: column; }
.suggestion {
  display: grid; grid-template-columns: 1fr auto auto auto;
  align-items: center; gap: 10px;
  padding: 7px 8px; border-radius: 4px; transition: background 0.1s;
}
.suggestion:hover { background: rgba(255, 255, 255, 0.7); }
.suggestion .sugg-text {
  border: none; background: transparent; font-size: 14px;
  color: var(--text); outline: none; width: 100%; padding: 2px 0;
}
.suggestion select.sugg-board {
  font-size: 12px; padding: 3px 8px; border-radius: 4px;
  border: 1px solid var(--divider); background: #fff;
  color: var(--text-soft); cursor: pointer;
}
.sugg-add, .sugg-skip {
  border: none; background: transparent; color: var(--text-soft);
  font-size: 13px; cursor: pointer; padding: 4px 8px; border-radius: 4px;
}
.sugg-add { color: var(--accent); font-weight: 500; }
.sugg-add:hover, .sugg-skip:hover { background: var(--hover); }

.db { margin-bottom: 36px; }
.db-head {
  position: sticky; top: 0; background: var(--bg);
  padding: 6px 0 4px; margin-bottom: 6px; z-index: 2;
}
.db-head h2 {
  display: flex; align-items: center; gap: 6px;
  font-size: 20px; font-weight: 600; margin: 0 0 8px;
  cursor: pointer; user-select: none; line-height: 1.3;
}
.toggle-caret {
  display: inline-block; width: 14px; font-size: 11px;
  color: var(--text-mute); transition: transform 0.15s;
}
.db.collapsed .toggle-caret { transform: rotate(-90deg); }
.db.collapsed .db-body { display: none; }
.db.collapsed .db-tabs { display: none; }
.emoji { font-size: 18px; }
.db-count { font-size: 13px; color: var(--text-mute); font-weight: 400; margin-left: 4px; }

.db-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--divider); }
.tab {
  background: none; border: none; font-size: 13px; color: var(--text-soft);
  padding: 6px 10px; cursor: pointer; border-radius: 4px 4px 0 0;
  position: relative; margin-bottom: -1px;
}
.tab:hover { background: var(--hover); color: var(--text); }
.tab.active { color: var(--text); font-weight: 500; box-shadow: inset 0 -2px 0 var(--text); }

.db-rows { display: flex; flex-direction: column; }

.row {
  display: grid; grid-template-columns: 22px 1fr auto auto auto 28px;
  align-items: center; gap: 8px;
  padding: 6px 4px; border-bottom: 1px solid var(--divider);
  transition: background 0.08s; min-height: 38px;
}
@media (max-width: 700px) {
  .row { grid-template-columns: 22px 1fr auto 28px; }
  .row .prio-cell, .row .date-cell { display: none; }
}
.row:hover { background: var(--hover); }

.row .check {
  width: 18px; height: 18px; border: 1.5px solid var(--text-mute);
  border-radius: 4px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  margin-left: 2px; transition: 0.12s;
}
.row .check:hover { border-color: var(--text-soft); background: var(--hover); }
.row.done .check { background: var(--text-soft); border-color: var(--text-soft); }
.row.done .check::after { content: "✓"; color: #fff; font-size: 12px; font-weight: 700; line-height: 1; }

.row .title {
  outline: none; font-size: 14.5px; word-break: break-word;
  padding: 2px 2px; cursor: text;
}
.row.done .title { color: var(--text-mute); text-decoration: line-through; }

.pill {
  display: inline-block; font-size: 12px; padding: 2px 8px;
  border-radius: 3px; line-height: 1.5; white-space: nowrap;
  cursor: pointer; user-select: none;
}
.pill.todo  { background: var(--pill-todo-bg);  color: var(--pill-todo-fg); }
.pill.doing { background: var(--pill-doing-bg); color: var(--pill-doing-fg); }
.pill.done  { background: var(--pill-done-bg);  color: var(--pill-done-fg); }
.pill.prio-high   { background: var(--pill-high-bg); color: var(--pill-high-fg); }
.pill.prio-medium { background: var(--pill-med-bg);  color: var(--pill-med-fg); }
.pill.prio-low    { background: var(--pill-low-bg);  color: var(--pill-low-fg); }
.pill.placeholder {
  background: transparent; color: var(--text-mute);
  border: 1px dashed transparent; opacity: 0; transition: opacity 0.1s;
}
.row:hover .pill.placeholder { opacity: 1; }

.date-cell {
  font-size: 12.5px; color: var(--text-soft);
  padding: 2px 8px; border-radius: 3px; cursor: pointer;
  white-space: nowrap; user-select: none;
}
.date-cell:hover { background: var(--hover-2); color: var(--text); }
.date-cell.placeholder { color: var(--text-mute); opacity: 0; transition: opacity 0.1s; }
.row:hover .date-cell.placeholder { opacity: 1; }
.date-cell.overdue { color: #d44; }
.date-cell.today { color: #2383e2; font-weight: 500; }

.row-more {
  opacity: 0; background: none; border: none; cursor: pointer;
  color: var(--text-mute); font-size: 16px;
  width: 26px; height: 26px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center; transition: 0.1s;
}
.row:hover .row-more { opacity: 1; }
.row-more:hover { background: var(--hover-2); color: var(--text); }

.db-add {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 4px; color: var(--text-mute);
  border-bottom: 1px solid var(--divider); transition: background 0.08s;
}
.db-add:hover { background: var(--hover); }
.add-icon {
  display: inline-flex; width: 22px;
  align-items: center; justify-content: center;
  font-size: 16px; line-height: 1; margin-left: 2px;
}
.add-input {
  flex: 1; border: none; background: transparent; outline: none;
  font-size: 14px; padding: 4px 0; color: var(--text);
}
.add-input::placeholder { color: var(--text-mute); }

.row.empty {
  color: var(--text-mute); font-size: 13px; font-style: italic;
  border-bottom: 1px solid var(--divider);
  grid-template-columns: 1fr; padding: 8px 4px 8px 28px;
}

.hidden-datepicker {
  position: absolute; opacity: 0; pointer-events: none;
  left: -9999px; width: 1px; height: 1px;
}

.page-title-row { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  background: none; border: none; font-size: 18px;
  color: var(--text-mute); cursor: pointer;
  width: 32px; height: 32px; border-radius: 4px;
  display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn:hover { background: var(--hover); color: var(--text); }

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(15, 15, 15, 0.4);
  display: flex; align-items: center; justify-content: center; z-index: 200;
}
.modal {
  background: #fff; border-radius: 6px;
  box-shadow: 0 10px 40px rgba(15, 15, 15, 0.2);
  width: min(520px, 92vw); overflow: hidden;
}
.modal-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px; border-bottom: 1px solid var(--divider);
}
.modal-head h3 { margin: 0; font-size: 15px; }
.modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 16px; }
.setting-row { display: flex; flex-direction: column; gap: 6px; }
.setting-row label { font-size: 12px; color: var(--text-soft); font-weight: 500; }
.setting-row input, .setting-row select {
  font-family: inherit; font-size: 14px;
  padding: 8px 10px; border-radius: 4px;
  border: 1px solid var(--divider-strong); outline: none; background: #fff;
}
.setting-row input:focus, .setting-row select:focus { border-color: var(--accent); }
.setting-hint { font-size: 12px; color: var(--text-mute); line-height: 1.5; }
.setting-hint a { color: var(--accent); text-decoration: none; }
.setting-hint a:hover { text-decoration: underline; }
.modal-foot {
  padding: 12px 18px; border-top: 1px solid var(--divider);
  display: flex; justify-content: flex-end; gap: 8px;
}

.popover {
  position: absolute; background: #fff;
  border: 1px solid var(--divider); border-radius: 6px;
  box-shadow: 0 4px 16px rgba(15, 15, 15, 0.12), 0 0 0 1px rgba(15, 15, 15, 0.04);
  padding: 6px; min-width: 160px; z-index: 100;
}
.popover-item {
  padding: 6px 8px; border-radius: 4px; cursor: pointer;
  display: flex; align-items: center;
}
.popover-item:hover { background: var(--hover); }
.popover-item.danger:hover { background: #fdecea; color: var(--danger); }
.popover-sep { height: 1px; background: var(--divider); margin: 4px 2px; }
.popover-text { font-size: 13.5px; }

.ghost-btn {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 13px; padding: 4px 10px; border-radius: 4px;
  background: transparent; border: 1px solid var(--divider);
  color: var(--text-soft); cursor: pointer; transition: 0.1s;
}
.ghost-btn:hover { background: var(--hover); color: var(--text); }

.text-btn {
  background: none; border: none; cursor: pointer;
  color: var(--text-mute); font-size: 12px;
  padding: 2px 4px; border-radius: 3px;
}
.text-btn:hover { color: var(--text); background: var(--hover); }

.page-foot {
  display: flex; align-items: center; gap: 12px;
  margin-top: 64px; padding-top: 16px;
  border-top: 1px solid var(--divider);
  color: var(--text-mute); font-size: 12px;
}
.page-foot > span { margin-right: auto; }
</style>
</head>
<body>
<div class="page">

  <div class="cover">📊</div>

  <header class="page-header">
    <div class="page-title-row">
      <h1 contenteditable="true" spellcheck="false">每日任務儀表板</h1>
      <button class="icon-btn" id="btnOpenSettings" title="設定">⚙</button>
    </div>
    <div class="page-meta">
      <span id="dateLabel"></span>
      <span class="dot-sep">·</span>
      <span id="statSummary">0 個任務</span>
    </div>
  </header>

  <div class="callout" id="ocrCallout">
    <div class="callout-icon">📸</div>
    <div class="callout-body">
      <div class="callout-head">
        <div class="callout-title">截圖自動辨識</div>
        <label class="ghost-btn">
          上傳截圖
          <input type="file" id="fileInput" accept="image/*" hidden />
        </label>
      </div>
      <div class="callout-desc">
        把截圖拖進來、按 <kbd>Ctrl</kbd>+<kbd>V</kbd> 貼上,或點上方按鈕。系統會辨識文字並建議分類到對應區塊。
      </div>
      <div id="dropZone" class="drop-zone">
        <span class="drop-text">拖曳或貼上圖片 · 點此選擇檔案</span>
      </div>
      <div id="previewWrap" class="preview-wrap" hidden>
        <img id="previewImg" alt="preview" />
      </div>
      <div id="ocrStatus" class="ocr-status" hidden></div>
      <div id="ocrResult" class="ocr-result" hidden>
        <div class="ocr-result-head">
          <span class="ocr-result-title">辨識結果</span>
          <div class="ocr-result-actions">
            <button class="ghost-btn" id="btnAddAll">全部依建議加入</button>
            <button class="ghost-btn" id="btnClearOcr">清除</button>
          </div>
        </div>
        <div id="suggestionList" class="suggestion-list"></div>
      </div>
    </div>
  </div>

  <section class="db" data-board="notes">
    <div class="db-head">
      <h2><span class="toggle-caret">▾</span><span class="emoji">📒</span><span class="db-title">筆記</span><span class="db-count" data-count></span></h2>
      <div class="db-tabs">
        <button class="tab active" data-filter="all">全部</button>
        <button class="tab" data-filter="todo">尚未完成</button>
        <button class="tab" data-filter="doing">進行中</button>
        <button class="tab" data-filter="done">已完成</button>
      </div>
    </div>
    <div class="db-body">
      <div class="db-rows"></div>
      <div class="db-add"><span class="add-icon">+</span><input type="text" class="add-input" placeholder="新增筆記" /></div>
    </div>
  </section>

  <section class="db" data-board="work">
    <div class="db-head">
      <h2><span class="toggle-caret">▾</span><span class="emoji">💼</span><span class="db-title">工作</span><span class="db-count" data-count></span></h2>
      <div class="db-tabs">
        <button class="tab active" data-filter="all">全部</button>
        <button class="tab" data-filter="todo">尚未完成</button>
        <button class="tab" data-filter="doing">進行中</button>
        <button class="tab" data-filter="done">已完成</button>
      </div>
    </div>
    <div class="db-body">
      <div class="db-rows"></div>
      <div class="db-add"><span class="add-icon">+</span><input type="text" class="add-input" placeholder="新增工作項目" /></div>
    </div>
  </section>

  <section class="db" data-board="meetings">
    <div class="db-head">
      <h2><span class="toggle-caret">▾</span><span class="emoji">🤝</span><span class="db-title">會議</span><span class="db-count" data-count></span></h2>
      <div class="db-tabs">
        <button class="tab active" data-filter="all">全部</button>
        <button class="tab" data-filter="todo">待進行</button>
        <button class="tab" data-filter="doing">進行中</button>
        <button class="tab" data-filter="done">已結束</button>
      </div>
    </div>
    <div class="db-body">
      <div class="db-rows"></div>
      <div class="db-add"><span class="add-icon">+</span><input type="text" class="add-input" placeholder="新增會議 (例: 14:00 與設計團隊週會)" /></div>
    </div>
  </section>

  <section class="db" data-board="personal">
    <div class="db-head">
      <h2><span class="toggle-caret">▾</span><span class="emoji">🌱</span><span class="db-title">個人計畫</span><span class="db-count" data-count></span></h2>
      <div class="db-tabs">
        <button class="tab active" data-filter="all">全部</button>
        <button class="tab" data-filter="todo">尚未完成</button>
        <button class="tab" data-filter="doing">進行中</button>
        <button class="tab" data-filter="done">已完成</button>
      </div>
    </div>
    <div class="db-body">
      <div class="db-rows"></div>
      <div class="db-add"><span class="add-icon">+</span><input type="text" class="add-input" placeholder="新增個人計畫 (運動 / 閱讀 / 學習...)" /></div>
    </div>
  </section>

  <footer class="page-foot">
    <span>資料儲存於本機 (localStorage)</span>
    <button class="text-btn" id="btnExport">匯出 JSON</button>
    <button class="text-btn" id="btnReset">清空所有資料</button>
  </footer>

  <div id="popover" class="popover" hidden></div>
  <input id="datePicker" type="date" class="hidden-datepicker" />

  <div id="settingsBackdrop" class="modal-backdrop" hidden
       onclick="if(event.target===this)this.hidden=true">
    <div class="modal">
      <div class="modal-head">
        <h3>設定</h3>
        <button type="button" class="icon-btn modal-close" id="btnCloseSettings"
                title="關閉 (Esc)" aria-label="關閉"
                onclick="document.getElementById('settingsBackdrop').hidden=true">✕</button>
      </div>
      <div class="modal-body">
        <div class="setting-row">
          <label>截圖辨識引擎</label>
          <select id="ocrEngine">
            <option value="tesseract">Tesseract.js (本機,免設定,中文準確度普通)</option>
            <option value="vision">Claude Vision (準確度最高,需 API Key)</option>
          </select>
        </div>
        <div class="setting-row" id="apiKeyRow" hidden>
          <label>Anthropic API Key</label>
          <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off" />
          <div class="setting-hint">
            金鑰只儲存在您本機 (localStorage)。瀏覽器直接呼叫 Anthropic API,需在
            <a href="https://console.anthropic.com/" target="_blank" rel="noopener">console.anthropic.com</a> 取得。
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="ghost-btn" id="btnSaveSettings">儲存並關閉</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ============================================================
   每日任務儀表板 — Notion 風格 (desktop bundle)
   ============================================================ */

const STORAGE_KEY  = 'dashboard.tasks.v2';
const SETTINGS_KEY = 'dashboard.settings.v1';
const BOARDS   = ['notes', 'work', 'meetings', 'personal'];
const STATUSES = ['todo', 'doing', 'done'];

const BOARD_LABEL = {
  notes: '📒 筆記', work: '💼 工作',
  meetings: '🤝 會議', personal: '🌱 個人計畫',
};
const STATUS_LABEL = { todo: '尚未完成', doing: '進行中', done: '已完成' };
const PRIO_LABEL   = { high: '高', medium: '中', low: '低' };

function emptyData() {
  const d = { _ui: { collapsed: {}, filter: {} } };
  BOARDS.forEach(b => { d[b] = []; d._ui.filter[b] = 'all'; });
  return d;
}
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return emptyData();
    const parsed = JSON.parse(raw);
    if (!parsed._ui) parsed._ui = { collapsed: {}, filter: {} };
    if (!parsed._ui.filter) parsed._ui.filter = {};
    if (!parsed._ui.collapsed) parsed._ui.collapsed = {};
    BOARDS.forEach(b => {
      if (!Array.isArray(parsed[b])) parsed[b] = [];
      if (!parsed._ui.filter[b]) parsed._ui.filter[b] = 'all';
      parsed[b].forEach(t => {
        if (t.priority === undefined) t.priority = null;
        if (t.dueDate === undefined) t.dueDate = null;
      });
    });
    return parsed;
  } catch { return emptyData(); }
}
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function loadSettings() {
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; }
  catch { return {}; }
}
function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }

let state = loadData();
let settings = loadSettings();

function addTask(board, text, opts = {}) {
  const t = (text || '').trim();
  if (!t) return;
  state[board].push({
    id: crypto.randomUUID(),
    text: t,
    status:   opts.status   ?? 'todo',
    priority: opts.priority ?? null,
    dueDate:  opts.dueDate  ?? null,
    createdAt: Date.now(),
  });
  saveData();
  renderBoard(board);
  renderHeader();
}
function updateTask(board, id, patch) {
  const list = state[board];
  const i = list.findIndex(t => t.id === id);
  if (i === -1) return;
  list[i] = { ...list[i], ...patch };
  saveData();
  renderBoard(board);
  renderHeader();
}
function deleteTask(board, id) {
  state[board] = state[board].filter(t => t.id !== id);
  saveData();
  renderBoard(board);
  renderHeader();
}

function pad(n) { return String(n).padStart(2, '0'); }
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function addDaysISO(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function formatDateLabel(iso) {
  if (!iso) return '';
  const t = todayISO();
  if (iso === t) return '今天';
  if (iso === addDaysISO(1)) return '明天';
  if (iso === addDaysISO(-1)) return '昨天';
  const [y, m, d] = iso.split('-');
  const now = new Date();
  if (Number(y) === now.getFullYear()) return `${Number(m)}/${Number(d)}`;
  return `${y}/${Number(m)}/${Number(d)}`;
}
function dateState(iso) {
  if (!iso) return '';
  const t = todayISO();
  if (iso < t) return 'overdue';
  if (iso === t) return 'today';
  return '';
}

function renderAll() {
  BOARDS.forEach(renderBoard);
  renderHeader();
  applyCollapseStates();
}
function renderBoard(board) {
  const section = document.querySelector(`.db[data-board="${board}"]`);
  if (!section) return;
  const filter = state._ui.filter[board] || 'all';
  section.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.filter === filter);
  });
  const all = state[board] || [];
  const filtered = filter === 'all' ? all : all.filter(t => t.status === filter);
  section.querySelector('[data-count]').textContent = all.length ? `· ${all.length}` : '';
  const container = section.querySelector('.db-rows');
  container.innerHTML = '';
  if (filtered.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'row empty';
    empty.textContent = filter === 'all' ? '尚無項目,在下方新增第一筆。' : '此分頁目前沒有項目。';
    container.appendChild(empty);
  } else {
    filtered.forEach(t => container.appendChild(rowNode(board, t)));
  }
}

function rowNode(board, task) {
  const row = document.createElement('div');
  row.className = 'row' + (task.status === 'done' ? ' done' : '');
  row.dataset.id = task.id;

  const check = document.createElement('div');
  check.className = 'check';
  check.title = '切換 完成 / 尚未完成';
  check.addEventListener('click', () => {
    const next = task.status === 'done' ? 'todo' : 'done';
    updateTask(board, task.id, { status: next });
  });

  const title = document.createElement('div');
  title.className = 'title';
  title.contentEditable = 'true';
  title.spellcheck = false;
  title.textContent = task.text;
  title.addEventListener('blur', () => {
    const v = title.textContent.trim();
    if (!v) { deleteTask(board, task.id); return; }
    if (v !== task.text) updateTask(board, task.id, { text: v });
  });
  title.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); title.blur(); }
    if (e.key === 'Escape') { title.textContent = task.text; title.blur(); }
  });

  const prioCell = document.createElement('div');
  prioCell.className = 'prio-cell';
  const prio = document.createElement('span');
  if (task.priority) {
    prio.className = 'pill prio-' + task.priority;
    prio.textContent = PRIO_LABEL[task.priority];
  } else {
    prio.className = 'pill placeholder';
    prio.textContent = '＋ 優先度';
  }
  prio.addEventListener('click', e => {
    e.stopPropagation();
    openPopover(prio, [
      { html: '<span class="pill prio-high">高</span>',   onClick: () => updateTask(board, task.id, { priority: 'high' }) },
      { html: '<span class="pill prio-medium">中</span>', onClick: () => updateTask(board, task.id, { priority: 'medium' }) },
      { html: '<span class="pill prio-low">低</span>',    onClick: () => updateTask(board, task.id, { priority: 'low' }) },
      { sep: true },
      { label: '清除',  onClick: () => updateTask(board, task.id, { priority: null }) },
    ]);
  });
  prioCell.appendChild(prio);

  const dateCell = document.createElement('div');
  if (task.dueDate) {
    dateCell.className = 'date-cell ' + dateState(task.dueDate);
    dateCell.textContent = formatDateLabel(task.dueDate);
  } else {
    dateCell.className = 'date-cell placeholder';
    dateCell.textContent = '＋ 日期';
  }
  dateCell.addEventListener('click', e => {
    e.stopPropagation();
    openPopover(dateCell, [
      { label: '今天',    onClick: () => updateTask(board, task.id, { dueDate: todayISO() }) },
      { label: '明天',    onClick: () => updateTask(board, task.id, { dueDate: addDaysISO(1) }) },
      { label: '後天',    onClick: () => updateTask(board, task.id, { dueDate: addDaysISO(2) }) },
      { label: '一週後',  onClick: () => updateTask(board, task.id, { dueDate: addDaysISO(7) }) },
      { sep: true },
      { label: '自選日期...', onClick: () => openDatePicker(d => updateTask(board, task.id, { dueDate: d || null }), task.dueDate) },
      { label: '清除', onClick: () => updateTask(board, task.id, { dueDate: null }), danger: true },
    ]);
  });

  const statusCell = document.createElement('div');
  statusCell.className = 'status-cell';
  const pill = document.createElement('span');
  pill.className = 'pill ' + task.status;
  pill.textContent = STATUS_LABEL[task.status];
  pill.addEventListener('click', e => {
    e.stopPropagation();
    openPopover(pill, [
      { html: '<span class="pill todo">尚未完成</span>',  onClick: () => updateTask(board, task.id, { status: 'todo' }) },
      { html: '<span class="pill doing">進行中</span>',   onClick: () => updateTask(board, task.id, { status: 'doing' }) },
      { html: '<span class="pill done">已完成</span>',    onClick: () => updateTask(board, task.id, { status: 'done' }) },
      { sep: true },
      { label: '刪除', danger: true, onClick: () => deleteTask(board, task.id) },
    ]);
  });
  statusCell.appendChild(pill);

  const more = document.createElement('button');
  more.className = 'row-more';
  more.title = '更多';
  more.textContent = '⋯';
  more.addEventListener('click', e => {
    e.stopPropagation();
    openPopover(more, [
      { label: '切換 完成 / 尚未完成', onClick: () => updateTask(board, task.id, { status: task.status === 'done' ? 'todo' : 'done' }) },
      { sep: true },
      { label: '刪除', danger: true, onClick: () => deleteTask(board, task.id) },
    ]);
  });

  row.append(check, title, prioCell, dateCell, statusCell, more);
  return row;
}

function renderHeader() {
  const now = new Date();
  const wk = ['週日','週一','週二','週三','週四','週五','週六'][now.getDay()];
  document.getElementById('dateLabel').textContent =
    `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} ${wk}`;
  let total = 0, done = 0, doing = 0;
  BOARDS.forEach(b => state[b].forEach(t => {
    total++;
    if (t.status === 'done') done++;
    else if (t.status === 'doing') doing++;
  }));
  const parts = [`${total} 個任務`];
  if (doing) parts.push(`${doing} 進行中`);
  if (done)  parts.push(`${done} 已完成`);
  document.getElementById('statSummary').textContent = parts.join(' · ');
}
function applyCollapseStates() {
  document.querySelectorAll('.db').forEach(sec => {
    const b = sec.dataset.board;
    sec.classList.toggle('collapsed', !!state._ui.collapsed[b]);
  });
}

document.querySelectorAll('.db').forEach(section => {
  const board = section.dataset.board;
  section.querySelector('.db-head h2').addEventListener('click', () => {
    state._ui.collapsed[board] = !state._ui.collapsed[board];
    saveData();
    section.classList.toggle('collapsed', !!state._ui.collapsed[board]);
  });
  section.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      state._ui.filter[board] = tab.dataset.filter;
      saveData();
      renderBoard(board);
    });
  });
  const input = section.querySelector('.add-input');
  const submit = () => {
    if (input.value.trim()) {
      addTask(board, input.value);
      input.value = '';
      input.focus();
    }
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  section.querySelector('.db-add').addEventListener('click', e => {
    if (e.target !== input) input.focus();
  });
});

const popover = document.getElementById('popover');
function openPopover(anchor, items) {
  popover.innerHTML = '';
  items.forEach(item => {
    if (item.sep) {
      const sep = document.createElement('div');
      sep.className = 'popover-sep';
      popover.appendChild(sep);
      return;
    }
    const el = document.createElement('div');
    el.className = 'popover-item' + (item.danger ? ' danger' : '');
    if (item.html) el.innerHTML = item.html;
    else el.innerHTML = `<span class="popover-text">${item.label}</span>`;
    el.addEventListener('click', () => {
      try { item.onClick && item.onClick(); }
      finally { closePopover(); }
    });
    popover.appendChild(el);
  });
  popover.hidden = false;
  const rect = anchor.getBoundingClientRect();
  const popRect = popover.getBoundingClientRect();
  let top = rect.bottom + window.scrollY + 6;
  let left = rect.left + window.scrollX;
  if (left + popRect.width > window.scrollX + window.innerWidth - 12) {
    left = window.scrollX + window.innerWidth - popRect.width - 12;
  }
  if (top + popRect.height > window.scrollY + window.innerHeight - 12) {
    top = rect.top + window.scrollY - popRect.height - 6;
  }
  popover.style.top = top + 'px';
  popover.style.left = left + 'px';
}
function closePopover() { popover.hidden = true; }
document.addEventListener('click', e => {
  if (!popover.hidden && !popover.contains(e.target)) closePopover();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !popover.hidden) closePopover();
});

const datePicker = document.getElementById('datePicker');
let datePickerCb = null;
datePicker.addEventListener('change', () => {
  if (datePickerCb) { datePickerCb(datePicker.value || null); datePickerCb = null; }
});
function openDatePicker(cb, current) {
  datePickerCb = cb;
  datePicker.value = current || '';
  datePicker.focus();
  if (typeof datePicker.showPicker === 'function') datePicker.showPicker();
  else datePicker.click();
}

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const previewWrap = document.getElementById('previewWrap');
const previewImg = document.getElementById('previewImg');
const ocrStatus = document.getElementById('ocrStatus');
const ocrResult = document.getElementById('ocrResult');
const suggestionList = document.getElementById('suggestionList');

dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f) handleImageFile(f);
});
['dragenter','dragover'].forEach(ev => dropZone.addEventListener(ev, e => {
  e.preventDefault(); e.stopPropagation(); dropZone.classList.add('drag');
}));
['dragleave','drop'].forEach(ev => dropZone.addEventListener(ev, e => {
  e.preventDefault(); e.stopPropagation(); dropZone.classList.remove('drag');
}));
dropZone.addEventListener('drop', e => {
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) handleImageFile(f);
});
window.addEventListener('paste', e => {
  if (e.target.matches('[contenteditable], input, textarea')) return;
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const it of items) {
    if (it.type && it.type.startsWith('image/')) {
      const f = it.getAsFile();
      if (f) { handleImageFile(f); break; }
    }
  }
});
document.getElementById('btnClearOcr').addEventListener('click', clearOcr);

function clearOcr() {
  previewWrap.hidden = true;
  previewImg.removeAttribute('src');
  ocrStatus.hidden = true;
  ocrStatus.classList.remove('error');
  ocrResult.hidden = true;
  suggestionList.innerHTML = '';
  fileInput.value = '';
}
async function handleImageFile(file) {
  clearOcr();
  previewImg.src = URL.createObjectURL(file);
  previewWrap.hidden = false;
  const engine = settings.ocrEngine || 'tesseract';
  if (engine === 'vision') {
    if (!settings.apiKey) {
      setStatus('需先在「設定」填入 Anthropic API Key 才能使用 Claude Vision。已自動退回 Tesseract。', true);
      await runTesseract(file);
      return;
    }
    await runClaudeVision(file);
  } else {
    await runTesseract(file);
  }
}
async function runTesseract(file) {
  setStatus('🔍 Tesseract 辨識中,首次載入語言檔可能 10-20 秒...');
  try {
    const { data } = await Tesseract.recognize(file, 'chi_tra+eng', {
      logger: m => {
        if (m.status === 'recognizing text' && m.progress != null) {
          setStatus(`🔍 辨識中... ${Math.round(m.progress * 100)}%`);
        } else if (m.status) {
          setStatus(`🔍 ${m.status}...`);
        }
      },
    });
    const lines = extractLines(data.text);
    if (!lines.length) { setStatus('未辨識到文字,請嘗試更清晰的截圖。', true); return; }
    const suggestions = lines.map(line => ({
      text: stripMeta(line),
      board: classifyLine(line),
      priority: detectPriority(line),
      dueDate: detectDate(line),
    }));
    setStatus(`✅ Tesseract 已擷取 ${suggestions.length} 條,請確認後加入。`);
    renderSuggestions(suggestions);
  } catch (err) {
    console.error(err);
    setStatus('Tesseract 失敗: ' + (err.message || err), true);
  }
}
async function runClaudeVision(file) {
  setStatus('🧠 Claude Vision 分析中...');
  try {
    const base64 = await fileToBase64(file);
    const media_type = file.type || 'image/png';
    const body = {
      model: 'claude-sonnet-4-6',
      max_tokens: 1500,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type, data: base64 } },
          { type: 'text', text:
`你是一個生產力助理。請從這張截圖中擷取所有可以變成「待辦」、「會議」、「筆記」或「個人計畫」的條目。

對每一條輸出 JSON 物件,放在一個 JSON 陣列中,結構為:
{
  "text": "簡潔描述 (不要含時間/優先度標記)",
  "board": "notes" | "work" | "meetings" | "personal",
  "priority": "high" | "medium" | "low" | null,
  "dueDate": "YYYY-MM-DD" 或 null
}

分類規則:
- meetings: 任何有時間+人/部門/主題的會議或活動
- work: 工作相關的任務、報告、客戶、專案、deadline
- personal: 運動、閱讀、學習、家庭、健康
- notes: 沒有明確動作的想法、備忘、知識點

日期請解析為今天 (${todayISO()}) 為基準的絕對日期。若沒有日期請給 null。
只輸出 JSON 陣列,不要前後文字。`,
          },
        ],
      }],
    };
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': settings.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify(body),
    });
    if (!resp.ok) {
      const txt = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${txt.slice(0, 300)}`);
    }
    const json = await resp.json();
    const text = (json.content && json.content[0] && json.content[0].text) || '';
    const arr = parseJsonArray(text);
    if (!arr.length) { setStatus('Claude 未回傳任何項目。', true); return; }
    setStatus(`✨ Claude Vision 已擷取 ${arr.length} 條結構化結果。`);
    renderSuggestions(arr.map(x => ({
      text: x.text || '',
      board: BOARDS.includes(x.board) ? x.board : 'notes',
      priority: ['high','medium','low'].includes(x.priority) ? x.priority : null,
      dueDate: typeof x.dueDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x.dueDate) ? x.dueDate : null,
    })));
  } catch (err) {
    console.error(err);
    setStatus('Claude Vision 失敗: ' + (err.message || err) + ' (退回 Tesseract)', true);
    await runTesseract(file);
  }
}
function parseJsonArray(text) {
  const m = text.match(/\[[\s\S]*\]/);
  if (!m) return [];
  try { return JSON.parse(m[0]); } catch { return []; }
}
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const s = r.result;
      const i = s.indexOf('base64,');
      resolve(i >= 0 ? s.slice(i + 7) : s);
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function setStatus(msg, isError=false) {
  ocrStatus.hidden = false;
  ocrStatus.textContent = msg;
  ocrStatus.classList.toggle('error', !!isError);
}
function extractLines(text) {
  return text.split(/\r?\n/)
    .map(s => s.replace(/\s+/g,' ').trim())
    .filter(s => s.length >= 2 && !/^[\W_]+$/.test(s));
}
function classifyLine(line) {
  if (/會議|會\b|例會|週會|月會|站會|meeting|sync|standup|1:1|review|kickoff|簡報/i.test(line)) return 'meetings';
  if (/\d{1,2}[:點]\d{0,2}.*(與|跟|和|with)/i.test(line)) return 'meetings';
  if (/工作|專案|報告|客戶|公司|交付|報表|\bpr\b|bug|deploy|deadline|交件|主管|同事|kpi|okr|報價|提案/i.test(line)) return 'work';
  if (/運動|健身|跑步|游泳|閱讀|讀書|看書|學習|家庭|家人|旅行|旅遊|理財|冥想|早睡|料理|烹飪|語言|英文|日文/i.test(line)) return 'personal';
  return 'notes';
}
function detectPriority(line) {
  if (/(p0|p1|緊急|urgent|asap|最高|超急|今天必)/i.test(line)) return 'high';
  if (/(重要|important|p2|高|盡快)/i.test(line)) return 'high';
  if (/(中等|p3|一般)/i.test(line)) return 'medium';
  if (/(低|p4|有空|次要)/i.test(line)) return 'low';
  return null;
}
function detectDate(line) {
  if (/今天|today/i.test(line)) return todayISO();
  if (/明天|tomorrow/i.test(line)) return addDaysISO(1);
  if (/後天/.test(line)) return addDaysISO(2);
  if (/大後天/.test(line)) return addDaysISO(3);
  const wk = line.match(/(下週|本週|這週|下星期|本星期)([一二三四五六日天])/);
  if (wk) {
    const map = { '一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0 };
    const target = map[wk[2]];
    const now = new Date();
    const dow = now.getDay();
    let diff = target - dow;
    if (wk[1].startsWith('下')) diff += 7;
    else if (diff <= 0) diff += 7;
    return addDaysISO(diff);
  }
  const md = line.match(/(?<![0-9])(\d{1,2})[\/\-月](\d{1,2})/);
  if (md) {
    const now = new Date();
    return `${now.getFullYear()}-${pad(Number(md[1]))}-${pad(Number(md[2]))}`;
  }
  return null;
}
function stripMeta(line) {
  return line.replace(/(p[0-9]|緊急|urgent|asap|重要|important|今天|明天|後天|大後天)/gi, '')
    .replace(/\s+/g, ' ').trim();
}
function renderSuggestions(suggestions) {
  suggestionList.innerHTML = '';
  suggestions.forEach(s => {
    const row = document.createElement('div');
    row.className = 'suggestion';
    if (s.priority) row.dataset.priority = s.priority;
    if (s.dueDate)  row.dataset.dueDate  = s.dueDate;
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'sugg-text';
    input.value = s.text;
    const select = document.createElement('select');
    select.className = 'sugg-board';
    BOARDS.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b; opt.textContent = BOARD_LABEL[b];
      if (b === s.board) opt.selected = true;
      select.appendChild(opt);
    });
    const addBtn = document.createElement('button');
    addBtn.className = 'sugg-add';
    addBtn.textContent = '加入';
    addBtn.addEventListener('click', () => {
      addTask(select.value, input.value, { priority: s.priority, dueDate: s.dueDate });
      row.remove();
      if (!suggestionList.children.length) {
        ocrResult.hidden = true;
        setStatus('🎉 全部建議已處理完成。');
      }
    });
    const skipBtn = document.createElement('button');
    skipBtn.className = 'sugg-skip';
    skipBtn.textContent = '略過';
    skipBtn.addEventListener('click', () => {
      row.remove();
      if (!suggestionList.children.length) ocrResult.hidden = true;
    });
    row.append(input, select, addBtn, skipBtn);
    suggestionList.appendChild(row);
  });
  ocrResult.hidden = false;
}
document.getElementById('btnAddAll').addEventListener('click', () => {
  const rows = [...suggestionList.querySelectorAll('.suggestion')];
  if (!rows.length) return;
  rows.forEach(r => {
    addTask(r.querySelector('select').value, r.querySelector('.sugg-text').value, {
      priority: r.dataset.priority || null,
      dueDate:  r.dataset.dueDate || null,
    });
  });
  suggestionList.innerHTML = '';
  ocrResult.hidden = true;
  setStatus('🎉 已將辨識結果加入對應區塊。');
});

const backdrop = document.getElementById('settingsBackdrop');
const ocrEngineSel = document.getElementById('ocrEngine');
const apiKeyRow = document.getElementById('apiKeyRow');
const apiKeyInput = document.getElementById('apiKey');
function openSettings() {
  ocrEngineSel.value = settings.ocrEngine || 'tesseract';
  apiKeyInput.value = settings.apiKey || '';
  apiKeyRow.hidden = ocrEngineSel.value !== 'vision';
  backdrop.hidden = false;
}
function closeSettings() { backdrop.hidden = true; }
document.getElementById('btnOpenSettings').addEventListener('click', openSettings);
// Event delegation: handle close button + backdrop clicks in one place,
// so even if a child element catches the click, closest() still finds the button.
backdrop.addEventListener('click', e => {
  if (e.target === backdrop) { closeSettings(); return; }
  if (e.target.closest && e.target.closest('#btnCloseSettings')) closeSettings();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !backdrop.hidden) { e.preventDefault(); closeSettings(); }
});
ocrEngineSel.addEventListener('change', () => {
  apiKeyRow.hidden = ocrEngineSel.value !== 'vision';
});
document.getElementById('btnSaveSettings').addEventListener('click', () => {
  settings.ocrEngine = ocrEngineSel.value;
  settings.apiKey = apiKeyInput.value.trim();
  saveSettings();
  closeSettings();
});

document.getElementById('btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `dashboard-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
});
document.getElementById('btnReset').addEventListener('click', () => {
  if (confirm('確定清空所有資料?此操作無法復原。')) {
    state = emptyData();
    saveData();
    renderAll();
  }
});

renderAll();
setInterval(renderHeader, 60_000);
</script>
